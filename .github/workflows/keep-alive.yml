# Free Supabase projects pause after 7 days without activity.
# This pings /api/health (which runs one small DB query) every 3 days so the database never pauses.
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions -> Variables -> New variable
#        SITE_URL = https://your-site.netlify.app
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *' # 06:17 UTC on every 3rd day of the month
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "Set the SITE_URL repository variable"; exit 1; fi
          for i in 1 2 3; do
            if curl -fsS --max-time 30 "$SITE_URL/api/health"; then echo; echo "OK"; exit 0; fi
            echo "Attempt $i failed, retrying in 20s"; sleep 20
          done
          exit 1
